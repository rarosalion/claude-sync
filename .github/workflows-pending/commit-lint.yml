name: Commit lint

# Releases are computed from commit messages (see release.yml), so every commit in a pull
# request must be a Conventional Commit: `type(optional-scope)!: description`. Merge commits are
# ignored.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit subjects
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if ! [[ "$subject" =~ $pattern ]]; then
              echo "::error::Commit $sha is not a Conventional Commit: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' "origin/${{ github.base_ref }}..HEAD")
          if [ "$bad" -ne 0 ]; then
            echo "Use feat:, fix:, perf:, refactor:, docs:, test:, build:, ci:, chore:, style: or revert: (see CONTRIBUTING.md)."
            exit 1
          fi
